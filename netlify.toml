# ---------------------------------------------------------------------------
# /samedaygaterepair — static HTML landing page
#
# The page is plain HTML at public/samedaygaterepair.html, not a Next.js route.
# Without this rule the request would reach the `[citySlug]` route, which has
# `dynamicParams = false` and returns 404 for any slug it does not know.
#
# A 200 rewrite (not a redirect), so the address bar and the canonical URL stay
# https://shieldgaterepair.com/samedaygaterepair. Netlify matches the rule with
# or without a trailing slash. `force = true` so it wins over the Next.js
# runtime. The page's canonical tag covers anyone who requests the .html file
# directly.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/samedaygaterepair"
  to = "/samedaygaterepair.html"
  status = 200
  force = true

# Google Ads destination: never let an intermediary serve a stale copy.
[[headers]]
  for = "/samedaygaterepair"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------------
# Static asset caching
#
# Netlify's default for these files is:
#   Cache-Control: public, max-age=0, must-revalidate
#
# Measured on production 3 Sep 2026 — every image on the site carried it,
# including the 90KB LCP hero. It means a browser that ALREADY HAS the file
# still opens a conditional request and waits for the 304 before it can paint.
# Across ~1,280 image files that is a lot of latency bought for nothing, and it
# is what PageSpeed reports as "Use efficient cache lifetimes".
#
# `immutable` rather than a short TTL because these filenames already encode
# content identity: scripts/process-assets.ts emits `<slug>-<n>-<width>.<fmt>`
# from a deterministic pipeline, so homepage-04-800.avif denotes exactly one
# photograph at exactly one width.
#
# ⚠️ THE FILENAMES ARE NOT CONTENT-HASHED.
# A browser that cached one of these will not re-fetch it for a year. If the
# BYTES behind an existing filename ever change — a re-encode at a different
# quality, a logo revision — THE FILENAME MUST CHANGE TOO. Deploying purges
# Netlify's edge; it cannot purge anyone's browser.
#
# Setting this now is deliberate rather than incidental: CrUX still reports no
# field data for the domain, so there is effectively no returning-visitor cache
# to strand. The AVIF quality change of 1 Sep (q62 → q50) reused every
# filename, and is precisely the kind of edit that will need a rename once this
# is live.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
